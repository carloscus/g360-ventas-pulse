<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#008f5d" />
		<meta name="application-name" content="VentasPulse CIPSA" />
		<meta name="description" content="Cockpit de campo para vendedores CIPSA: clientes, ficha comercial, radar de recompra, precios y stock" />
		<meta name="author" content="Carlos Cusi - G360" />
		<meta name="generator" content="G360" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="color-scheme" content="light dark" />
		<meta property="og:title" content="VentasPulse CIPSA" />
		<meta property="og:description" content="Cockpit de ventas en campo" />
		<meta property="og:type" content="website" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			(function() {
				var theme = localStorage.getItem('theme');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
